name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: canary
            - run: bun install --frozen-lockfile
            - name: Install Chromium when required
              run: |
                  if node -e 'const p=require("./package.json"); process.exit(p.devDependencies?.playwright ? 0 : 1)'; then
                    bunx playwright install --with-deps chromium
                  fi
            - run: bun check
            - run: test ! -f bunfig.toml || ! grep -q '^\[lint\]' bunfig.toml || bun lint
            - run: bun run build
            - run: bun run --if-present test
            - run: bun pm pack --destination "${{ runner.temp }}"
